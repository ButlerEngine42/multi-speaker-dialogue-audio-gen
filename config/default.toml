# multi-speaker-dialogue-audio-gen — default host config
[host]
plugin_paths = ["plugins", "src/msdag/backends"]
plugin_isolation = "inprocess"   # inprocess | subprocess
log_level = "info"

[render]
sample_rate = 48000
bit_depth = 16
master_gain_db = -1.5
inter_utterance_gap_ms = 180
crossfade_ms = 12
speaker_pan = true

[backends]
default = "piper"
fallback = "edge"

[output]
dir = "renders"
format = "wav"          # wav | flac | mp3
stem = "{script_name}_{timestamp}"

[cloud]
# keys live in config/local.toml, never here
endpoint = ""
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "multi-speaker-dialogue-audio-gen"
version = "0.6.2"
description = "AI multi-speaker dialogue audio generator — plugin-host desktop tool for turning scripts into multi-voice renders."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "msdag contributors" }]
keywords = ["tts", "dialogue", "multi-speaker", "audio", "plugin-host", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
  "numpy>=1.26,<3",
  "soundfile>=0.12.1",
  "pydantic>=2.6,<3",
  "typer>=0.12",
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10", "pip-audit>=2.7"]
cloud = ["httpx>=0.27"]
local = ["onnxruntime>=1.18"]

[project.scripts]
msdag = "msdag.host.cli:app"

[project.entry-points."msdag.backends"]
piper = "msdag.backends.piper_backend:PiperBackend"
edge  = "msdag.backends.edge_backend:EdgeBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/msdag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["msdag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]